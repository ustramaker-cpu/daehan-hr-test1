buildscript {
    ext {
        springBootVersion = '3.5.16'
    }
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath('io.spring.gradle:dependency-management-plugin:1.1.7')
    }
}

allprojects {
    group = 'com.ustra.hr.ufw'
    version = '0.0.1-SNAPSHOT'

    configurations {
        all {
            // log4j2 사용을 위한 필수 exclude. 누락 시 logback 과 충돌한다.
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
            exclude group: 'ch.qos.logback', module: 'logback-classic'
            exclude group: 'commons-logging', module: 'commons-logging'
        }
    }
}

subprojects {

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'

    sourceCompatibility = '21'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    ext {
        set('gsitmFrameworkVersion', "1.0")
    }

    tasks.register('initSourceFolders') {
        sourceSets*.java.srcDirs*.each {
            if (!it.exists()) {
                it.mkdirs()
            }
        }

        sourceSets*.resources.srcDirs*.each {
            if (!it.exists()) {
                it.mkdirs()
            }
        }
    }

    repositories {
        mavenCentral()
        maven {
            url "https://repo.gsitm.com/repository/public/"
        }
    }

    dependencies {
        developmentOnly("org.springframework.boot:spring-boot-devtools")

        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.security:spring-security-core'
        implementation 'org.springframework.security:spring-security-web'
        implementation 'org.springframework.security:spring-security-config'
        implementation 'org.springframework.boot:spring-boot-starter-mail'

        implementation 'org.springframework.boot:spring-boot-starter-log4j2'

        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
        implementation 'com.fasterxml.jackson.core:jackson-databind'
        implementation 'com.fasterxml.jackson.core:jackson-core'

        // https://mvnrepository.com/artifact/org.apache.tomcat/tomcat-catalina-ha
        implementation group: 'org.apache.tomcat', name: 'tomcat-catalina-ha', version: '10.1.55'

        implementation 'org.springframework.boot:spring-boot-starter-validation'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation('org.springframework.boot:spring-boot-starter-test') {
            exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        }
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'io.projectreactor:reactor-test'

        // Spring Boot 3.x 는 mybatis-spring-boot-starter 3.0.x 필수 (2.x 는 javax 기반)
        implementation group: 'org.mybatis.spring.boot', name: 'mybatis-spring-boot-starter', version: '3.0.5'
        implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.9'
        implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
        implementation group: 'commons-beanutils', name: 'commons-beanutils', version: '1.9.4'
        implementation group: 'commons-codec', name: 'commons-codec', version: '1.14'
        implementation group: 'commons-io', name: 'commons-io', version: '2.19.0'
        implementation group: 'org.modelmapper', name: 'modelmapper', version: '2.3.6'

        implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.2'
        implementation group: 'commons-validator', name: 'commons-validator', version: '1.7'

        implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1'

        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springframework.session:spring-session-core'

        //hometax
        implementation 'com.bpa.hometax:bcprov-ext-jdk15:1.4.5'
        implementation 'com.bpa.hometax:exportFile:2.0.2'
        implementation 'com.bpa.hometax:itext:2.1.7'
        implementation 'com.bpa.hometax:jcaos-client-arcCert:1.4.7.1'
        implementation 'com.bpa.hometax:libDSTSPDFSig:0.1'
        implementation 'com.bpa.hometax:libMagicTsaClient:0.1'
        implementation 'com.bpa.hometax:pdfbox:1.2.1'

        //httpclient 추가..
        implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
        implementation group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.16'

        // Boot 3.x 대응 라인 (3.x 이하는 Boot 3 미지원)
        implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:4.0.4'

        // jjwt 0.9.1(javax.xml.bind 의존) -> 0.13.0. 전 모듈 공통으로 끌어올림
        implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    }

    test {
        useJUnitPlatform()
    }

}
