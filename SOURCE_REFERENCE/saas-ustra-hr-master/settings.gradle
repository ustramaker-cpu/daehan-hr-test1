plugins {
    // JDK 21 이 로컬에 없을 경우 Gradle 이 자동으로 내려받도록 하는 toolchain resolver
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'saas-ustra-hr'

include 'framework-core'
include 'framework-data'
include 'framework-security'
include 'framework-security-jwt'
include 'framework-web'

include 'ustra-hr-system-core'
include 'ustra-hr-system-api'
include 'ustra-hr-system-pay'
include 'ustra-hr-system-auth'
include 'ustra-hr-system-report'
include 'ustra-hr-system-thymeleaf'
include 'ustra-hr-system-restapi'
include 'ustra-hr-system-pay-yeta'
