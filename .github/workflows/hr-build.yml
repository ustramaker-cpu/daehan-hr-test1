name: DFNE HR Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile HR application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Diagnose available framework modules
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          ./gradlew projects --no-daemon --console=plain \
            > evidence/projects.log 2>&1
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "PROJECT_LIST_OK"
            cat evidence/projects.log
          else
            echo "PROJECT_LIST_FAILED (exit=$rc)"
            tail -n 60 evidence/projects.log
            exit "$rc"
          fi

      - name: Compile available framework modules
        shell: bash
        run: |
          set +e
          failed=0

          modules=(
            framework-core
            framework-data
            framework-security
            framework-security-jwt
            framework-web
          )

          for module in "${modules[@]}"; do
            if [ ! -f "$module/build.gradle" ]; then
              echo "::notice title=Module skipped::$module has no build.gradle"
              continue
            fi

            echo "========== MODULE: $module =========="

            log="evidence/${module}.log"

            ./gradlew ":${module}:compileJava" \
              --no-daemon --stacktrace --console=plain \
              > "$log" 2>&1

            rc=$?

            if [ "$rc" -eq 0 ]; then
              echo "COMPILE_OK: $module"
              continue
            fi

            failed=1
            echo "COMPILE_FAILED: $module (exit=$rc)"

            if grep -Eqi \
              'Could not resolve|Could not find .* in|Could not GET|Could not HEAD|Read timed out|UnknownHostException|PKIX path building failed|Connection refused|No cached version' \
              "$log"; then
              echo "FAILURE_TYPE: DEPENDENCY_OR_REPOSITORY"
            elif grep -Eqi \
              'Project with path .* could not be found|project .* not found' \
              "$log"; then
              echo "FAILURE_TYPE: MISSING_PROJECT_REFERENCE"
            elif grep -Eqi \
              'error:|cannot find symbol|package .* does not exist|Compilation failed' \
              "$log"; then
              echo "FAILURE_TYPE: JAVA_SOURCE_COMPILATION"
            else
              echo "FAILURE_TYPE: OTHER_GRADLE_FAILURE"
            fi

            echo "----- Sanitized log tail: $module -----"

            # Avoid printing common secret assignments and credential-bearing URLs.
            sed -E \
              -e 's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1[REDACTED]@#g' \
              -e 's/((password|passwd|token|secret|api[_-]?key)[[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              "$log" | tail -n 60
          done

          echo "========== SUMMARY =========="

          if [ "$failed" -ne 0 ]; then
            echo "FRAMEWORK_BUILD_FAILED"
            exit 1
          fi

          echo "FRAMEWORK_BUILD_OK"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-build-diagnostics
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
