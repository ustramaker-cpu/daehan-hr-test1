
name: DFNE HR Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SOURCE_REFERENCE/saas-ustra-hr-master/**'
      - '01_EXECUTION_KIT/**'
      - '.github/workflows/hr-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile HR application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/SOURCE_REFERENCE/saas-ustra-hr-master"
          TOOLS="$GITHUB_WORKSPACE/01_EXECUTION_KIT/tools"

          test -f "$SRC/settings.gradle" || test -f "$SRC/settings.gradle.kts"
          test -f "$SRC/gradlew"
          test -f "$TOOLS/run_compile.sh"
          test -f "$TOOLS/redact_logs.py"

          chmod +x "$SRC/gradlew"
          java -version

      - name: Compile framework and build web application
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"

          bash "$GITHUB_WORKSPACE/01_EXECUTION_KIT/tools/run_compile.sh" \
            "$GITHUB_WORKSPACE/SOURCE_REFERENCE/saas-ustra-hr-master" \
            "$GITHUB_WORKSPACE/evidence"

      - name: Upload redacted build evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfne-hr-build-evidence
          path: |
            evidence/*.REDACTED.log
            evidence/*.exitcode
            evidence/java_version.log
          if-no-files-found: warn
          retention-days: 7
